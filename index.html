<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XmasPay - Send Love This Christmas</title>
<style>
body{font-family:Arial,sans-serif;background:#b71c1c;color:white;text-align:center;padding:20px;margin:0}
.box{background:white;color:#333;max-width:400px;margin:20px auto;padding:25px;border-radius:15px}
h1{font-size:28px}
.btn{background:#b71c1c;color:white;padding:14px 25px;border:none;border-radius:8px;font-size:18px;width:100%;cursor:pointer}

<body>
<h1>🎄 XmasPay 🎅</h1>
<p>Send Christmas Gifts & Cash With Love</p>

<div class="box">

<button class="btn" onclick="alert('Merry Christmas! Gift Sent Successfully 🎄')">Send Gift 🎁</button>
<p style="margin-top:15px;font-size:14px;color:green">✅ Site is Live!</p>

<p>© 2025 XmasPay</p>
